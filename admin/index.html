<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#EBE5D8" />

    <title>Admin — Nate Gaffney</title>

    <!-- Keep this page out of search results and link previews entirely. -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="referrer" content="no-referrer" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <script>
      (function () {
        var t = 'light'
        try {
          var saved = localStorage.getItem('ng-theme')
          if (saved === 'dark' || saved === 'light') t = saved
        } catch (e) {}
        document.documentElement.dataset.theme = t
      })()
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..600&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/admin/main.jsx"></script>
  </body>
</html>
