<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#00061B" />

    <title>Follow-up call — Nate Gaffney</title>
    <meta
      name="description"
      content="Book a 15-minute follow-up call with Nate Gaffney — a quick check-in for people he's already coached."
    />
    <!-- Handed out as a direct link to past coaching clients only — never
         linked from the site and never surfaced by search engines. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Social preview for when the link is shared in a DM. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Follow-up call — Nate Gaffney" />
    <meta
      property="og:description"
      content="A quick 15-minute check-in on where you've landed since the session. Pick a time that works."
    />
    <meta property="og:image" content="/images/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Sets the theme before first paint so there's no flash of the wrong
         one on load. Dark is the default; a saved choice wins. -->
    <script>
      (function () {
        var t = 'dark'
        try {
          var saved = localStorage.getItem('ng-theme')
          if (saved === 'dark' || saved === 'light') t = saved
        } catch (e) {}
        document.documentElement.dataset.theme = t
      })()
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..600&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/pages/followup-entry.jsx"></script>
  </body>
</html>
