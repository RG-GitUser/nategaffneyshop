# nginx for api.nategaffney.store
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/nategaffneyshop-api
#   sudo ln -s /etc/nginx/sites-available/nategaffneyshop-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.nategaffney.store
#
# certbot rewrites this file to add the TLS block. HTTPS is not optional:
# the admin session cookie is `secure` in production, so login silently
# fails over plain HTTP.

server {
    listen 80;
    listen [::]:80;
    server_name api.nategaffney.store;

    # Uploaded images are large; everything else is small JSON.
    client_max_body_size 10M;

    # Real client IP through to the app, so rate limiting doesn't see
    # every request as coming from 127.0.0.1.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    access_log /var/log/nginx/ng-api.access.log;
    error_log  /var/log/nginx/ng-api.error.log;
}

# -----------------------------------------------------------------
# The static site itself. Build locally with `npm run build`, then
# rsync dist/ to /var/www/nategaffneyshop/site.
# -----------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name nategaffney.store www.nategaffney.store;

    root /var/www/nategaffneyshop/site;
    index index.html;

    # /privacy/ /terms/ /admin/ are real directories with their own
    # index.html, so a plain directory lookup is all that's needed.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Hashed filenames, so these can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

