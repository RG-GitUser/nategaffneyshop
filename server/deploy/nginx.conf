# nginx for api.nategaffney.store
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/nategaffneyshop-api
#   sudo ln -s /etc/nginx/sites-available/nategaffneyshop-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.nategaffney.store
#
# certbot rewrites this file to add the TLS block. HTTPS is not optional:
# the admin session cookie is `secure` in production, so login silently
# fails over plain HTTP.
#
# CAUTION: because certbot's TLS config lives only in the DROPLET's copy,
# re-copying this file over it reverts the site to plain HTTP. To apply
# changes from here, edit the live file by hand (or re-run certbot after
# copying).

server {
    listen 80;
    listen [::]:80;
    server_name api.nategaffney.store;

    # Don't advertise the nginx version in headers and error pages.
    server_tokens off;

    # Uploaded images are large; everything else is small JSON.
    client_max_body_size 10M;

    # Security headers come from the app itself (helmet) — adding them
    # here too would duplicate them on every response.

    # Real client IP through to the app, so rate limiting doesn't see
    # every request as coming from 127.0.0.1.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    access_log /var/log/nginx/ng-api.access.log;
    error_log  /var/log/nginx/ng-api.error.log;
}

# -----------------------------------------------------------------
# The static site itself. Build locally with `npm run build`, then
# rsync dist/ to /var/www/nategaffneyshop/site.
# -----------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name nategaffney.store www.nategaffney.store;

    server_tokens off;

    root /var/www/nategaffneyshop/site;
    index index.html;

    # Security headers for the static site (the API gets these from
    # helmet). NOTE: nginx drops server-level add_header in any location
    # that declares its own, so every location with an add_header below
    # must repeat the whole set.
    #
    # HSTS is ignored by browsers over plain HTTP, so it's safe here and
    # becomes effective once certbot adds the TLS block.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Nothing under the web root should ever start with a dot, so refuse
    # them all rather than trusting the deploy to never publish one.
    location ~ /\. {
        deny all;
    }

    # /privacy/ /terms/ /admin/ are real directories with their own
    # index.html, so a plain directory lookup is all that's needed.
    #
    # no-cache on HTML is what keeps phones honest: each deploy renames
    # the hashed asset files, so a browser clinging to yesterday's HTML
    # requests CSS that no longer exists and renders the page bare —
    # which is exactly how a stale mobile cache "breaks" the site.
    # no-cache means "revalidate before using", not "never store".
    location / {
        try_files $uri $uri/ $uri/index.html =404;
        add_header Cache-Control "no-cache";
        # Repeated: this location's add_header suppresses the server-level set.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Hashed filenames, so these can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Repeated: this location's add_header suppresses the server-level set.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}

