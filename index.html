<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#EBE5D8" />

    <title>Nate Gaffney — Storytelling, mindset & building your thing</title>
    <meta
      name="description"
      content="Guides, coaching and courses from Nate Gaffney — Indigenous filmmaker and creator. Learn to tell better stories, grow your platform, and build a career you actually like."
    />

    <!-- Open Graph / social preview. Swap the image once you have a real one. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nate Gaffney — Storytelling, mindset & building your thing" />
    <meta
      property="og:description"
      content="Guides, coaching and courses for creators who want to tell better stories and grow something real."
    />
    <meta property="og:image" content="/images/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Sets the theme before first paint so there's no flash of the wrong
         one on load. Light is the default; a saved choice wins. -->
    <script>
      (function () {
        var t = 'light'
        try {
          var saved = localStorage.getItem('ng-theme')
          if (saved === 'dark' || saved === 'light') t = saved
        } catch (e) {}
        document.documentElement.dataset.theme = t
      })()
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Apple Garamond is proprietary and can't be served on the web, so it's
         first in the CSS stack for anyone who has it installed locally and
         EB Garamond is the fallback everyone else gets. -->
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..600&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
