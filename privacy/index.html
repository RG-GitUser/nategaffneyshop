<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#EBE5D8" />

    <title>Privacy Policy — Nate Gaffney</title>
    <meta
      name="description"
      content="What personal information this site collects, why, who it is shared with, and the control you have over it."
    />
    <meta name="robots" content="index, follow" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <script>
      (function () {
        var t = 'light'
        try {
          var saved = localStorage.getItem('ng-theme')
          if (saved === 'dark' || saved === 'light') t = saved
        } catch (e) {}
        document.documentElement.dataset.theme = t
      })()
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..600&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/pages/privacy-entry.jsx"></script>
  </body>
</html>
